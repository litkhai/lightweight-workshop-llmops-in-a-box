# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: LLMOps in a Box
site_description: A self-service workshop for observability, evaluation, and ClickHouse analytics on open-source Langfuse.
site_url: https://litkhai.github.io/lightweight-workshop-llmops-in-a-box/
repo_url: https://github.com/litkhai/lightweight-workshop-llmops-in-a-box
repo_name: litkhai/lightweight-workshop-llmops-in-a-box
edit_uri: edit/main/workshop/

docs_dir: workshop
site_dir: site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  icon:
    logo: material/database
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Workshop:
      - Overview: workshop-overview.md
      - "00 · Setup": 00-setup.md
      - "01 · Observability": 01-observability.md
      - "02 · Prompt Management": 02-prompt-management.md
      - "03 · Monitoring & Scores": 03-monitoring-and-scores.md
      - "04 · Datasets": 04-datasets.md
      - "05 · Experiments": 05-experiments.md
      - "06 · Evaluate a Change": 06-evaluate-a-change.md
      - "07 · Human & LLM Evaluation": 07-human-and-llm-evaluation.md
      - "08 · ClickHouse Analytics": 08-clickhouse-analytics.md
      - "09 · Wrap-up": 09-wrap-up.md
  - Operations:
      - Instructor Guide: instructor-guide.md
      - Docker Validation: docker-validation.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/clickhouse.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/litkhai/lightweight-workshop-llmops-in-a-box
      name: Workshop repository on GitHub

copyright: >-
  Independent educational workshop. ClickHouse is a registered trademark of
  ClickHouse, Inc. This site is not an official ClickHouse website and does not
  imply endorsement.
