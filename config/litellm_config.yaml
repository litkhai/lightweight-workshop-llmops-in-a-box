model_list:

  # ── Local CPU model (Ollama) ─────────────────────────────────────────────────
  - model_name: local
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama:11434
      timeout: 120
    model_info:
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ── Cloud model (optional — only used when ANTHROPIC_API_KEY is set) ─────────
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30
    model_info:
      mode: chat

  # ── Auto alias — language routing decides the actual model ──────────────────
  - model_name: auto
    litellm_params:
      model: local
    model_info:
      mode: chat

litellm_settings:
  success_callback: []
  failure_callback: []
  request_timeout: 120
  drop_params: true
  callbacks: [callbacks.language_router]
  default_tags: [lightweight-workshop]

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - { "local": [claude-sonnet] }
    - { "auto": [claude-sonnet] }

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
