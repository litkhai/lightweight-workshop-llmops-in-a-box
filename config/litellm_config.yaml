model_list:
  - model_name: local
    litellm_params:
      model: os.environ/OLLAMA_MODEL_PROVIDER
      api_base: http://ollama:11434
      reasoning_effort: none
      timeout: 120
    model_info:
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60
    model_info:
      mode: chat

  # LibreChat only sees this stable alias. The callback chooses its backend.
  - model_name: auto
    litellm_params:
      model: os.environ/OLLAMA_MODEL_PROVIDER
      api_base: http://ollama:11434
      reasoning_effort: none
      timeout: 120
    model_info:
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  callbacks:
    - callbacks.model_router
    - langfuse_otel
  request_timeout: 120
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
